name: Foundation checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: python -m venv .venv
      - run: .venv/bin/python -m pip install -r requirements.lock
      - run: npm ci
      - run: make check
      - name: Dependency audit
        run: make audit
